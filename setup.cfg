[metadata]
name = noodlesnake
description = Chess engine
author = Ryan Xue

[options]
packages = 
    noodlesnake
install_requires = 
    berserk >= 0.14.0
    chess >= 1.9.0
    numpy >= 1.21.5
    python-dotenv >= 1.0.0
python_requires = >= 3.10
package_dir = 
    =src
zip_safe = no

[options.entry_points]
console_scripts =
    noodlesnake-lichess = noodlesnake.lichess:main
    noodlesnake-uci = noodlesnake.uci:main
